name: Android release
# A v* tag builds the four ABIs, packages the AAR and publishes it with its
# SHA-256. A manual run, or a pull request that touches the release path,
# builds and packages the same way and only uploads the AAR as an artifact.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/android-release.yml
      - .github/actions/android-toolchain/**
      - .github/actions/android-sandbox/**
      - tools/android-sandbox
      - tools/require-android-sandbox
      - bindings/android/**
      - tools/build-android
      - tools/compile-android-kotlin
      - tools/package-android
  workflow_dispatch:
permissions:
  contents: read
jobs:
  aar:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
        with:
          ndk: "true"
      - uses: ./.github/actions/android-sandbox
      - id: version
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          if [[ $GITHUB_REF_TYPE == tag && $GITHUB_REF_NAME != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: android-sandbox --sh 'tools/build-android arm64-v8a x86_64 armeabi-v7a x86'
      - run: android-sandbox --sh 'tools/package-android'
      - run: cd dist && sha256sum -c "lib-t3-rust-android-v${{ steps.version.outputs.version }}.aar.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: lib-t3-rust-android-v${{ steps.version.outputs.version }}
          path: |
            dist/lib-t3-rust-android-v${{ steps.version.outputs.version }}.aar
            dist/lib-t3-rust-android-v${{ steps.version.outputs.version }}.aar.sha256
          if-no-files-found: error
      - if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lib-t3-rust-android-v${{ steps.version.outputs.version }}.aar
            dist/lib-t3-rust-android-v${{ steps.version.outputs.version }}.aar.sha256
          fail_on_unmatched_files: true
