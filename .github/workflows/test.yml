name: Native library checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-sandbox
      - run: android-sandbox --sh 'python3 tools/test_android_sandbox.py'
      - run: android-sandbox --sh 'cargo test --locked'
      - run: android-sandbox --sh 'tools/test-c-abi'
      - run: android-sandbox --sh 'tools/test-jni'
  kotlin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/android-toolchain
      - uses: ./.github/actions/android-sandbox
      - run: android-sandbox --sh 'tools/compile-android-kotlin "$CARGO_TARGET_DIR/android-classes"'
      - run: android-sandbox --sh 'tools/test-jni'
      - run: android-sandbox --sh 'tools/test-kotlin-jni'
